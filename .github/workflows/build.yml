name: Build
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: bash ./gradlew --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: BoundaryGuard
          path: build/libs/BoundaryGuard-*.jar
